apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: devboard
spec:
  # Enforce mTLS for workloads inside the devboard namespace.
  # This intentionally does not cover logging/search-service yet because
  # that workload is outside the mesh and will be handled separately.
  mtls:
    mode: STRICT
