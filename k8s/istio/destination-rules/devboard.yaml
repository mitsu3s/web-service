---
# web-bff: edge fan-in from the ingress gateway; prefer less-loaded BFF pods.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: web-bff
  namespace: devboard
spec:
  host: web-bff
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: LEAST_CONN
    # BFF can multiplex many frontend/browser requests into upstream calls.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
---
# board-service: read aggregation can fan out to several internal services.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: board-service
  namespace: devboard
spec:
  host: board-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: LEAST_CONN
    # Dashboard/task reads can queue behind multiple downstream lookups.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
---
# identity-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: identity-service
  namespace: devboard
spec:
  host: identity-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Login/register paths should fail fast instead of building a long queue.
    connectionPool:
      http:
        http1MaxPendingRequests: 50
---
# membership-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: membership-service
  namespace: devboard
spec:
  host: membership-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Membership checks are synchronous policy lookups; keep pending work bounded.
    connectionPool:
      http:
        http1MaxPendingRequests: 50
---
# access-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: access-service
  namespace: devboard
spec:
  host: access-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Authorization is on the critical path for task/project operations.
    connectionPool:
      http:
        http1MaxPendingRequests: 50
---
# task-orchestrator-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: task-orchestrator-service
  namespace: devboard
spec:
  host: task-orchestrator-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Write orchestration may wait on access/workflow/command services.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
---
# task-command-service: write model endpoint protected by a basic circuit breaker.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: task-command-service
  namespace: devboard
spec:
  host: task-command-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Command writes should absorb short bursts from the orchestrator.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
    # Eject unhealthy command-service endpoints to avoid repeated write failures.
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
# board-query-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: board-query-service
  namespace: devboard
spec:
  host: board-query-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Read-model queries can spike after dashboard/task list requests.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
---
# notification-service: no connectionPool override yet; SSE behavior is app-level.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: notification-service
  namespace: devboard
spec:
  host: notification-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
---
# project-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: project-service
  namespace: devboard
spec:
  host: project-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    # Project creation and lookup are on user-facing request paths.
    connectionPool:
      http:
        http1MaxPendingRequests: 100
---
# activity-service: no connectionPool override yet; currently only board reads call it.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: activity-service
  namespace: devboard
spec:
  host: activity-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
---
# workflow-service: no connectionPool override yet; lightweight workflow validation.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: workflow-service
  namespace: devboard
spec:
  host: workflow-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
---
# search-service: logging namespace is intentionally outside devboard mTLS scope for now.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: search-service
  namespace: devboard
spec:
  host: search-service.logging.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
