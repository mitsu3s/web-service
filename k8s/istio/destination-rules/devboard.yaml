---
# task-command-service: circuit breaker example
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: task-command-service
  namespace: devboard
spec:
  host: task-command-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      http:
        http1MaxPendingRequests: 100
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
