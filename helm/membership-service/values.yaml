replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-membership-service
  pullPolicy: IfNotPresent
  tag: "d521070554873e772ffc061ae67019dd04ee2379"
service:
  type: ClusterIP
  port: 8080
env:
  MYSQL_DSN: "devboard:devboard123@tcp(mysql:3306)/devboard?charset=utf8mb4&parseTime=True&loc=Local"
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 300m
    memory: 128Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
