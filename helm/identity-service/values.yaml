replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-identity-service
  pullPolicy: IfNotPresent
  tag: "3a3500bc626160d5d3ea4c256df133fa8872db5a"
service:
  type: ClusterIP
  port: 8080
env:
  JWT_SECRET: "change-me-in-production"
  MYSQL_DSN: "devboard:devboard123@tcp(mysql:3306)/devboard?charset=utf8mb4&parseTime=True&loc=Local"
  OTEL_SERVICE_NAME: "identity-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
