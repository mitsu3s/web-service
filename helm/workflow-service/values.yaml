replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-workflow-service
  pullPolicy: IfNotPresent
  tag: "ec49e5c2a664c7ea2fb977ec8395abbd8f89538f"
service:
  type: ClusterIP
  port: 8080
env:
  PROJECT_SERVICE_URL: "http://project-service:8080"
  OTEL_SERVICE_NAME: "workflow-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 300m
    memory: 128Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
