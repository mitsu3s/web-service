replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-board-service
  pullPolicy: IfNotPresent
  tag: "4a0ae8e5c3f55ae4b3505332c0c0c45535485f4b"
service:
  type: ClusterIP
  port: 8080
env:
  MEMBERSHIP_SERVICE_URL: "http://membership-service:8080"
  PROJECT_SERVICE_URL: "http://project-service:8080"
  ACCESS_SERVICE_URL: "http://access-service:8080"
  BOARD_QUERY_SERVICE_URL: "http://board-query-service:8080"
  ACTIVITY_SERVICE_URL: "http://activity-service:8080"
  SEARCH_SERVICE_URL: "http://search-service:8080"
  WORKFLOW_SERVICE_URL: "http://workflow-service:8080"
  OTEL_SERVICE_NAME: "board-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
