replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-web-bff
  pullPolicy: IfNotPresent
  tag: "e8258a6a5beee4fc9c80ebe77f545722c61985b9"
service:
  type: ClusterIP
  port: 8080
env:
  JWT_SECRET: "change-me-in-production"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  BOARD_SERVICE_URL: "http://board-service:8080"
  PROJECT_SERVICE_URL: "http://project-service:8080"
  TASK_ORCHESTRATOR_SERVICE_URL: "http://task-orchestrator-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  FRONTEND_URL: "http://frontend:3000"
  OTEL_SERVICE_NAME: "web-bff"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
