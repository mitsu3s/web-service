replicaCount: 1
image:
  repository: ghcr.io/mitsu3s/devboard-search-service
  pullPolicy: IfNotPresent
  tag: "3a3500bc626160d5d3ea4c256df133fa8872db5a"
service:
  type: ClusterIP
  port: 8080
env:
  RABBITMQ_URL: "amqp://devboard:devboard123@rabbitmq:5672/"
  ACCESS_SERVICE_URL: "http://access-service:8080"
  ELASTICSEARCH_URL: "https://elasticsearch-es-http.logging.svc:9200"
  ELASTICSEARCH_USERNAME: "elastic"
  ELASTICSEARCH_CA_CERT_PATH: "/etc/elasticsearch/certs/tls.crt"
  TASKS_INDEX_NAME: "devboard-tasks"
  OTEL_SERVICE_NAME: "search-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
elasticsearch:
  passwordSecret:
    name: search-service-elasticsearch-credentials
    key: password
  caSecret:
    name: search-service-elasticsearch-ca
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 15s
