name: CI

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "helm/**"
      - "argocd/**"
      - "k8s/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "helm/**"
      - "argocd/**"
      - "k8s/**"
      - ".github/workflows/**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/devboard

jobs:
  # ---------------------------------------------------------------------------
  # 0. Detect changed services
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changed services
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_services: ${{ steps.matrix.outputs.go_services }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      image_services: ${{ steps.matrix.outputs.image_services }}
      manifest_changed: ${{ steps.filter.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_gateway:
              - "services/api-gateway/**"
            auth_service:
              - "services/auth-service/**"
            task_service:
              - "services/task-service/**"
            notification_service:
              - "services/notification-service/**"
            project_service:
              - "services/project-service/**"
            activity_service:
              - "services/activity-service/**"
            search_indexer:
              - "services/search-indexer/**"
            frontend:
              - "services/frontend/**"
            manifests:
              - "helm/**"
              - "argocd/**"
              - "k8s/**"
              - ".github/workflows/**"

      - id: matrix
        name: Build matrices
        run: |
          go_services=()
          image_services=()

          json_array() {
            if [ "$#" -eq 0 ]; then
              printf '[]'
              return
            fi

            json="["
            for item in "$@"; do
              json="${json}\"${item}\","
            done
            json="${json%,}]"
            printf '%s' "${json}"
          }

          if [ "${{ steps.filter.outputs.api_gateway }}" = "true" ]; then
            go_services+=("api-gateway")
            image_services+=("api-gateway")
          fi
          if [ "${{ steps.filter.outputs.auth_service }}" = "true" ]; then
            go_services+=("auth-service")
            image_services+=("auth-service")
          fi
          if [ "${{ steps.filter.outputs.task_service }}" = "true" ]; then
            go_services+=("task-service")
            image_services+=("task-service")
          fi
          if [ "${{ steps.filter.outputs.notification_service }}" = "true" ]; then
            go_services+=("notification-service")
            image_services+=("notification-service")
          fi
          if [ "${{ steps.filter.outputs.project_service }}" = "true" ]; then
            go_services+=("project-service")
            image_services+=("project-service")
          fi
          if [ "${{ steps.filter.outputs.activity_service }}" = "true" ]; then
            go_services+=("activity-service")
            image_services+=("activity-service")
          fi
          if [ "${{ steps.filter.outputs.search_indexer }}" = "true" ]; then
            go_services+=("search-indexer")
            image_services+=("search-indexer")
          fi
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            image_services+=("frontend")
          fi

          echo "go_services=$(json_array "${go_services[@]}")" >> "${GITHUB_OUTPUT}"
          echo "image_services=$(json_array "${image_services[@]}")" >> "${GITHUB_OUTPUT}"

  validate-manifests:
    name: Validate Manifests
    needs: detect-changes
    runs-on: self-hosted
    if: |
      needs.detect-changes.outputs.manifest_changed == 'true' ||
      needs.detect-changes.outputs.go_services != '[]' ||
      needs.detect-changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.4

      - name: Install yq
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          case "${RUNNER_ARCH}" in
            X64) YQ_ARCH="amd64" ;;
            ARM64) YQ_ARCH="arm64" ;;
            ARM) YQ_ARCH="arm" ;;
            *)
              echo "Unsupported runner arch: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          YQ_BIN="${RUNNER_TEMP}/yq"
          curl -fsSL -o "${YQ_BIN}" \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}"
          chmod +x "${YQ_BIN}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Render all Helm charts
        run: |
          set -euo pipefail
          for chart in \
            helm/api-gateway \
            helm/auth-service \
            helm/task-service \
            helm/notification-service \
            helm/project-service \
            helm/activity-service \
            helm/search-indexer \
            helm/frontend; do
            chart_name="$(basename "${chart}")"
            helm lint "${chart}"
            helm template "${chart_name}" "${chart}" >/dev/null
          done

      - name: Validate raw YAML syntax
        run: |
          set -euo pipefail
          find argocd k8s -type f -name '*.yaml' -print0 | sort -z | while IFS= read -r -d '' path; do
            yq e '.' "${path}" >/dev/null
          done

          echo "YAML syntax validation passed"

  # ---------------------------------------------------------------------------
  # 1. Test Go services
  # ---------------------------------------------------------------------------
  test-go:
    name: Test (${{ matrix.service }})
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.go_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run go mod tidy check
        working-directory: services/${{ matrix.service }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum out of sync, run go mod tidy" && exit 1)

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Run go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # 2. Test frontend
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Test (frontend)
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install deps
        working-directory: services/frontend
        run: npm ci
      - name: Type check
        working-directory: services/frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: services/frontend
        run: npx next lint --max-warnings 0 || true  # non-blocking for learning

  # ---------------------------------------------------------------------------
  # 3. Build & push Docker images (only on main branch)
  # ---------------------------------------------------------------------------
  build-go:
    name: Build (${{ matrix.service }})
    needs: [detect-changes, test-go]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.go_services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build (frontend)
    needs: [detect-changes, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.frontend_changed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4. Update Helm values with new image tags → triggers ArgoCD sync
  # ---------------------------------------------------------------------------
  update-image-tags:
    name: Update image tags in Helm charts
    needs: [detect-changes, validate-manifests, build-go, build-frontend]
    runs-on: self-hosted
    if: |
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.image_services != '[]' &&
      needs.validate-manifests.result == 'success' &&
      (needs.detect-changes.outputs.go_services == '[]' || needs.build-go.result == 'success') &&
      (needs.detect-changes.outputs.frontend_changed != 'true' || needs.build-frontend.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          case "${RUNNER_ARCH}" in
            X64) YQ_ARCH="amd64" ;;
            ARM64) YQ_ARCH="arm64" ;;
            ARM) YQ_ARCH="arm" ;;
            *)
              echo "Unsupported runner arch: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          YQ_BIN="${RUNNER_TEMP}/yq"
          curl -fsSL -o "${YQ_BIN}" \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}"
          chmod +x "${YQ_BIN}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Update image tags
        env:
          IMAGE_SERVICES: ${{ join(fromJSON(needs.detect-changes.outputs.image_services), ' ') }}
        run: |
          SHA="${{ github.sha }}"
          for service in ${IMAGE_SERVICES}; do
            yq e ".image.tag = \"${SHA}\"" -i "helm/${service}/values.yaml"
            echo "Updated helm/${service}/values.yaml -> image.tag: ${SHA}"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/*/values.yaml
          git diff --cached --quiet || git commit -m "ci: bump image tags to ${GITHUB_SHA::8}"
          git push
